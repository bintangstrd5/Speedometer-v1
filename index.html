<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedometer Final</title>
  <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="speedo-root">
    <!-- Left Bars -->
    <div class="left-bars">
      <div class="bar-container">
        <div class="bar-label">H</div>
        <div class="bar health">
          <div class="bar-fill" id="health-bar"></div>
        </div>
        <div class="bar-percentage" id="health-percent">100%</div>
      </div>
      <div class="bar-container">
        <div class="bar-label">F</div>
        <div class="bar fuel">
          <div class="bar-fill" id="fuel-bar"></div>
        </div>
        <div class="bar-percentage" id="fuel-percent">100%</div>
      </div>
    </div>

    <!-- Center Panel -->
    <div class="center-panel">
      <!-- Grup Kecepatan & Gear -->
      <div class="speed-group">
        <div class="speed-container">
          <div class="speed-display" id="speed-display">0</div>
          <div class="gear-display" id="gear-display">N</div>
        </div>
        <div class="speed-unit" id="speed-unit">MPH</div> 
      </div>
      
      <!-- RPM Container (Yang Diperbaiki/Ditambahkan Kembali) -->
      <div class="rpm-container">
        <div id="rpm-boxes"></div>
      </div>

      <!-- Indikator Ikon -->
      <div class="indicators">
        <div class="icon indicator" id="icon-left" title="Left Signal">
          <img src="assets/images/circled-left-2.png" alt="Left Signal"/>
        </div>
        <div class="icon indicator" id="icon-engine" title="Engine">
          <img src="assets/images/engine.png" alt="engine"/>
        </div>
        <div class="icon indicator" id="icon-lights" title="Headlights">
          <img src="assets/images/external-lights-cars-components-those-icons-lineal-those-icons-1.png" alt="Low Beam" class="low-beam-icon"/>
          <img src="assets/images/external-lights-cars-components-those-icons-lineal-those-icons.png" alt="High Beam" class="high-beam-icon"/>
        </div>
        <div class="icon indicator" id="icon-seatbelt" title="Seatbelt">
          <img src="assets/images/external-Seatbelt-security-and-protection-(outline)-outline-andi-nur-abdillah.png" alt="Seatbelt"/>
        </div>
        <div class="icon indicator" id="icon-right" title="Right Signal">
          <img src="assets/images/circled-left-2.png" alt="Right Signal"/>
        </div>
      </div>
    </div>
  </main>
  
  <audio id="audio-tick" src="assets/audio/tick.wav" loop></audio>
  <audio id="audio-alarm" src="assets/audio/alarm.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
